
<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiliate Login | SPORTS BET</title>

    <style>
        :root {
            --green: #00C853;
            --green-dark: #008F3A;
            --yellow: #FFDF00;
            --white: #FFFFFF;
            --bg: #FFFFFF;
            --text: #183524;
            --muted: #66756B;
            --border: #DCE9DF;
            --light-green: #F2FBF5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        .affiliate-login-container {
            width: 100%;
            max-width: 440px;
        }

        .login-header {
            margin-bottom: 25px;
            text-align: center;
        }

        .brand {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .brand span {
            color: var(--green);
        }

        .brand strong {
            color: var(--yellow);
        }

        .login-header h1 {
            margin: 22px 0 8px;
            font-size: 27px;
        }

        .login-header p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .login-card {
            padding: 28px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(20, 80, 40, 0.09);
        }

        .form-group {
            margin-bottom: 19px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;
            min-height: 47px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            background: var(--white);
            color: var(--text);
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(0, 200, 83, 0.10);
        }

        .form-group input::placeholder {
            color: #89978D;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 70px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: var(--green-dark);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .forgot-row {
            margin-top: -8px;
            margin-bottom: 20px;
            text-align: right;
        }

        .forgot-row a,
        .signup-link a {
            color: var(--green-dark);
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .terms-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 21px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .terms-row input {
            width: 16px;
            height: 16px;
            margin: 2px 0 0;
            flex-shrink: 0;
            accent-color: var(--green);
            cursor: pointer;
        }

        .terms-row a {
            color: var(--green-dark);
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 9px;
            background: var(--green);
            color: var(--white);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .login-button:hover {
            background: var(--green-dark);
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .login-message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
        }

        .login-message.error {
            display: block;
            background: #FFF1F1;
            border: 1px solid #F0CACA;
            color: #A52222;
        }

        .login-message.success {
            display: block;
            background: var(--light-green);
            border: 1px solid var(--green);
            color: var(--green-dark);
        }

        .signup-link {
            margin: 23px 0 0;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: var(--green-dark);
            font-size: 13px;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 23px 18px;
            }

            .login-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <main class="affiliate-login-container">

        <header class="login-header">
            <div class="brand">
                SPORTS <span>BET</span><strong>.</strong>
            </div>

            <h1>Affiliate Login</h1>

            <p>
                Welcome back! Sign in to your affiliate account.
            </p>
        </header>

        <form class="login-card" id="affiliateLoginForm">

            <div class="form-group">
                <label for="loginIdentifier">
                    Affiliate ID or Email
                </label>

                <input
                    type="text"
                    id="loginIdentifier"
                    name="loginIdentifier"
                    placeholder="Enter Affiliate ID or email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="loginPassword"
                        name="loginPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                    >
                        Show
                    </button>
                </div>
            </div>

            <div class="forgot-row">
                <a href="affiliate-forgot-password.html">
                    Forgot Password?
                </a>
            </div>

            <label class="terms-row">
                <input
                    type="checkbox"
                    id="agreeTerms"
                    name="agreeTerms"
                    required
                >

                <span>
                    I agree to the
                    <a href="affiliate-terms.html">
                        Terms and Conditions
                    </a>
                    and
                    <a href="affiliate-privacy.html">
                        Privacy Policy
                    </a>.
                </span>
            </label>

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Login
            </button>

            <div
                class="login-message"
                id="loginMessage"
                role="status"
                aria-live="polite"
            ></div>

            <p class="signup-link">
                Don't have an affiliate account?
                <a href="affiliate-signup.html">Sign Up</a>
            </p>

            <a
                href="affiliate-program.html"
                class="back-link"
            >
                ← Back to Affiliate Program
            </a>

        </form>
    </main>

<script>
    // ==========================================
    // 1. SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL = "https://dijuduhvleunvwmnncue.supabase.co";
    const SUPABASE_KEY = "sb_publishable_dw-uENrowls3CoIxyJamJg_vtpR7wR3";
    const SCHEMA = "affiliate_program";

    // ==========================================
    // 2. GET LOGIN PAGE ELEMENTS
    // ==========================================

    const loginForm =
        document.getElementById("affiliateLoginForm");

    const loginIdentifier =
        document.getElementById("loginIdentifier");

    const loginPassword =
        document.getElementById("loginPassword");

    const passwordToggle =
        document.getElementById("passwordToggle");

    const agreeTerms =
        document.getElementById("agreeTerms");

    const loginButton =
        document.getElementById("loginButton");

    const loginMessage =
        document.getElementById("loginMessage");

    // ==========================================
    // 3. DISPLAY LOGIN MESSAGES
    // ==========================================

    function showLoginMessage(message, type = "error") {
        if (!loginMessage) return;

        loginMessage.className = "login-message " + type;
        loginMessage.textContent = message;
    }

    // ==========================================
    // 4. INITIALIZE SUPABASE CLIENT
    // ==========================================

    let client = null;

    if (
        SUPABASE_URL !== "YOUR_SUPABASE_PROJECT_URL" &&
        SUPABASE_KEY !== "YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY" &&
        window.supabase &&
        typeof window.supabase.createClient === "function"
    ) {
        client = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY,
            {
                db: {
                    schema: SCHEMA
                },
                auth: {
                    // Keep separate from the Sign-Up session for now.
                    storageKey: "affiliate-login-auth-token",
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true
                }
            }
        );
    }

    // Expose the initialized client for this page's login handler.
    window.supabaseClient = client;

    // ==========================================
    // 5. CHECK REQUIRED PAGE ELEMENTS
    // ==========================================

    if (
        !loginForm ||
        !loginIdentifier ||
        !loginPassword ||
        !passwordToggle ||
        !agreeTerms ||
        !loginButton ||
        !loginMessage
    ) {
        console.error(
            "[Affiliate Login] One or more required HTML elements are missing."
        );
    }

    // ==========================================
    // 6. SHOW / HIDE PASSWORD
    // ==========================================

    if (passwordToggle && loginPassword) {
        passwordToggle.addEventListener("click", function () {
            const isPassword =
                loginPassword.type === "password";

            loginPassword.type = isPassword ? "text" : "password";
            passwordToggle.textContent = isPassword ? "Hide" : "Show";
        });
    }

    // ==========================================
    // 7. AUTHENTICATE AND VERIFY AFFILIATE
    // ==========================================

    if (loginForm) {
        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            loginMessage.className = "login-message";
            loginMessage.textContent = "";

            if (!agreeTerms.checked) {
                showLoginMessage(
                    "Please agree to the Terms and Conditions and Privacy Policy."
                );
                return;
            }

            const identifier = loginIdentifier.value.trim();
            const password = loginPassword.value;

            if (!identifier || !password) {
                showLoginMessage(
                    "Please enter your email and password."
                );
                return;
            }

            // Email login is supported in this version.
            if (!identifier.includes("@")) {
                showLoginMessage(
                    "Please sign in using your registered email address. " +
                    "Affiliate ID login requires a secure ID-to-email lookup."
                );
                return;
            }

            // Ensure the Supabase client is ready.
            if (!client || !client.auth) {
                showLoginMessage(
                    "Supabase is not connected. Please check the Supabase " +
                    "URL, public key, and CDN script."
                );
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";

            let authenticated = false;

            try {
                // Step 1: Authenticate with Supabase Auth.
                const { data, error } =
                    await client.auth.signInWithPassword({
                        email: identifier,
                        password: password
                    });

                if (error) {
                    throw new Error(
                        "Login failed. Check your email and password."
                    );
                }

                if (!data || !data.user) {
                    throw new Error(
                        "Authentication succeeded without a user record."
                    );
                }

                authenticated = true;

                // Step 2: Verify the user's affiliate account.
                const { data: affiliate, error: affiliateError } =
                    await client
                        .schema(SCHEMA)
                        .from("affiliates")
                        .select("affiliate_id, status")
                        .eq("auth_user_id", data.user.id)
                        .maybeSingle();

                if (affiliateError) {
                    console.error(
                        "[Affiliate Login] Verification failed:",
                        affiliateError
                    );

                    throw new Error(
                        "We could not verify your affiliate account. " +
                        "Please check the account configuration and try again."
                    );
                }

                if (!affiliate) {
                    throw new Error(
                        "No affiliate account is linked to this login."
                    );
                }

                if (
                    String(affiliate.status || "").toLowerCase() !== "active"
                ) {
                    throw new Error(
                        "Your affiliate account is not active. " +
                        "Please contact the administrator."
                    );
                }

                // Step 3: Successful login.
                showLoginMessage(
                    "Login successful. Opening your affiliate dashboard...",
                    "success"
                );

                window.location.assign("affiliate-programme-dashboard.html");

            } catch (error) {
                console.error("[Affiliate Login]", error);

                // Sign out if authentication succeeded but
                // affiliate verification failed.
                if (authenticated) {
                    const { error: signOutError } =
                        await client.auth.signOut();

                    if (signOutError) {
                        console.error(
                            "[Affiliate Login] Sign-out failed:",
                            signOutError
                        );
                    }
                }

                showLoginMessage(
                    error.message ||
                    "Login could not be completed. Please try again."
                );

            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    }
</script>

</body>
</html>
